<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Converti — Unidades y Vectores</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f6f5ff;
  --card:#ffffff;
  --input:#f4f3fb;
  --border:#e5e3f0;
  --text:#20202a;
  --muted:#777487;
  --primary:#6c63ff;
  --primary-dark:#554ce6;
  --primary-soft:#eeecff;
  --danger:#ef4444;
  --success:#16a34a;
  --shadow:0 15px 40px rgba(56,48,120,.10);
  --radius:20px;
}

body.dark{
  --bg:#101016;
  --card:#191922;
  --input:#22222d;
  --border:#30303c;
  --text:#f5f5fa;
  --muted:#aaa8b8;
  --primary:#827aff;
  --primary-dark:#6c63ff;
  --primary-soft:#29265a;
  --shadow:0 15px 40px rgba(0,0,0,.35);
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 0% 0%,rgba(108,99,255,.15),transparent 35%),
    radial-gradient(circle at 100% 100%,rgba(108,99,255,.10),transparent 35%),
    var(--bg);
  color:var(--text);
  padding:18px;
  transition:.25s;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:680px;
  margin:auto;
}

/* HEADER */

.header{
  text-align:center;
  padding:15px 5px 20px;
}

.logo{
  width:58px;
  height:58px;
  margin:0 auto 12px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--primary),#9b95ff);
  color:white;
  font-size:28px;
  box-shadow:0 10px 25px rgba(108,99,255,.25);
}

.header h1{
  font-size:28px;
  font-weight:800;
  letter-spacing:-.7px;
}

.header p{
  color:var(--muted);
  margin-top:5px;
  font-size:14px;
}

/* THEME */

.top-actions{
  position:absolute;
  top:18px;
  right:18px;
}

.theme-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:13px;
  font-size:19px;
  box-shadow:var(--shadow);
}

/* CARD */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
}

/* TABS */

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:5px;
  background:var(--input);
  border-radius:15px;
  margin-bottom:20px;
}

.tab{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px;
  border-radius:11px;
  font-size:14px;
  font-weight:700;
}

.tab.active{
  background:var(--primary);
  color:white;
  box-shadow:0 5px 15px rgba(108,99,255,.25);
}

/* CONTENT */

.content{
  display:none;
}

.content.active{
  display:block;
}

/* FORM */

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.form-group{
  margin-bottom:15px;
}

input,
select{
  width:100%;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  padding:13px 14px;
  border-radius:13px;
  outline:none;
  font-size:15px;
}

input:focus,
select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(108,99,255,.12);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

/* UNIT CONVERTER */

.unit-row{
  display:grid;
  grid-template-columns:1fr 48px 1fr;
  gap:8px;
  align-items:end;
}

.swap{
  width:48px;
  height:48px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--input);
  color:var(--primary);
  font-size:21px;
  font-weight:700;
}

.swap:hover{
  background:var(--primary-soft);
  transform:rotate(180deg);
}

.result{
  margin-top:18px;
  padding:18px;
  border-radius:16px;
  background:var(--primary-soft);
  border:1px solid rgba(108,99,255,.18);
}

.result-title{
  font-size:11px;
  color:var(--primary);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px;
  margin-bottom:8px;
}

.result-value{
  font-size:22px;
  line-height:1.35;
  font-weight:800;
  word-break:break-word;
}

.result-formula{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
  line-height:1.5;
}

/* BUTTON */

.main-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  font-size:15px;
  font-weight:800;
  margin-top:5px;
  box-shadow:0 8px 20px rgba(108,99,255,.25);
}

.main-btn:active{
  transform:scale(.98);
}

/* HISTORY */

.history{
  margin-top:20px;
}

.history-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.history-header h3{
  font-size:14px;
}

.clear-history{
  border:0;
  background:transparent;
  color:var(--danger);
  font-size:12px;
  font-weight:700;
}

.history-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.history-item{
  padding:12px;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:13px;
}

.history-item strong{
  display:block;
  margin-bottom:3px;
}

.history-empty{
  color:var(--muted);
  text-align:center;
  padding:15px;
  font-size:13px;
}

/* VECTOR */

.section-title{
  color:var(--primary);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin:17px 0 8px;
}

.vector-input{
  text-align:center;
}

.vector-input::placeholder{
  color:var(--muted);
}

.vector-result{
  margin-top:18px;
}

.detail{
  line-height:1.7;
}

.detail b{
  color:var(--text);
}

/* FOOTER */

.footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:18px 0 5px;
}

/* RESPONSIVE */

@media(max-width:520px){

  body{
    padding:10px;
  }

  .card{
    padding:15px;
    border-radius:18px;
  }

  .header h1{
    font-size:24px;
  }

  .grid2{
    grid-template-columns:1fr;
    gap:0;
  }

  .unit-row{
    grid-template-columns:1fr;
  }

  .swap{
    width:100%;
    height:42px;
  }

  .grid3{
    gap:7px;
  }

  input,
  select{
    padding:12px 10px;
  }

  .result-value{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="top-actions">
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</div>

<div class="app">

  <header class="header">
    <div class="logo">∑</div>
    <h1>Converti</h1>
    <p>Conversor de unidades y operaciones vectoriales</p>
  </header>

  <div class="card">

    <!-- TABS -->

    <div class="tabs">
      <button class="tab active" onclick="switchTab('unidades',this)">
        📏 Unidades
      </button>

      <button class="tab" onclick="switchTab('vectores',this)">
        📐 Vectores
      </button>
    </div>


    <!-- ================= UNIDADES ================= -->

    <section id="unidades" class="content active">

      <div class="form-group">
        <label>Categoría</label>

        <select id="unitCat" onchange="loadUnits()">

          <option value="longitud">📏 Longitud</option>
          <option value="masa">⚖️ Masa</option>
          <option value="volumen">🧪 Volumen</option>
          <option value="area">▦ Área</option>
          <option value="velocidad">🚗 Velocidad</option>
          <option value="tiempo">⏱️ Tiempo</option>
          <option value="temperatura">🌡️ Temperatura</option>
          <option value="presion">💨 Presión</option>
          <option value="almacenamiento">💾 Datos digitales</option>
          <option value="energia">⚡ Energía</option>

        </select>
      </div>


      <div class="form-group">
        <label>Valor</label>

        <input
          id="unitVal"
          type="number"
          value="1"
          step="any"
          oninput="convertUnits()"
        >
      </div>


      <div class="unit-row">

        <div class="form-group">
          <label>De</label>
          <select id="unitFrom" onchange="convertUnits()"></select>
        </div>

        <button class="swap" onclick="swapUnits()">⇄</button>

        <div class="form-group">
          <label>A</label>
          <select id="unitTo" onchange="convertUnits()"></select>
        </div>

      </div>


      <div class="result">

        <div class="result-title">
          Resultado
        </div>

        <div class="result-value" id="unitResult">
          1 m = 100 cm
        </div>

        <div class="result-formula" id="unitFormula">
          Conversión automática
        </div>

      </div>


      <!-- HISTORIAL -->

      <div class="history">

        <div class="history-header">

          <h3>Historial</h3>

          <button class="clear-history" onclick="clearHistory()">
            Borrar
          </button>

        </div>

        <div id="historyList" class="history-list"></div>

      </div>

    </section>


    <!-- ================= VECTORES ================= -->

    <section id="vectores" class="content">

      <div class="grid2">

        <div class="form-group">

          <label>Dimensión</label>

          <select id="vecDim" onchange="updateVectorFields()">

            <option value="2d">2D — X, Y</option>
            <option value="3d">3D — X, Y, Z</option>

          </select>

        </div>


        <div class="form-group">

          <label>Operación</label>

          <select id="vecOp" onchange="updateVectorFields()">

            <option value="add">A + B — Suma</option>
            <option value="sub">A − B — Resta</option>
            <option value="mult">k · A — Multiplicación</option>
            <option value="div">A / k — División</option>
            <option value="dot">A · B — Producto punto</option>
            <option value="cross">A × B — Producto cruz</option>

          </select>

        </div>

      </div>


      <!-- VECTOR A -->

      <div class="section-title">
        Vector A
      </div>

      <div class="grid3">

        <input
          class="vector-input"
          id="ax"
          type="number"
          value="3"
          step="any"
          placeholder="Ax"
          oninput="calculateVectors()"
        >

        <input
          class="vector-input"
          id="ay"
          type="number"
          value="4"
          step="any"
          placeholder="Ay"
          oninput="calculateVectors()"
        >

        <input
          class="vector-input"
          id="az"
          type="number"
          value="0"
          step="any"
          placeholder="Az"
          style="display:none"
          oninput="calculateVectors()"
        >

      </div>


      <!-- VECTOR B -->

      <div id="vectorB">

        <div class="section-title">
          Vector B
        </div>

        <div class="grid3">

          <input
            class="vector-input"
            id="bx"
            type="number"
            value="1"
            step="any"
            placeholder="Bx"
            oninput="calculateVectors()"
          >

          <input
            class="vector-input"
            id="by"
            type="number"
            value="2"
            step="any"
            placeholder="By"
            oninput="calculateVectors()"
          >

          <input
            class="vector-input"
            id="bz"
            type="number"
            value="0"
            step="any"
            placeholder="Bz"
            style="display:none"
            oninput="calculateVectors()"
          >

        </div>

      </div>


      <!-- ESCALAR -->

      <div id="scalarBox" style="display:none">

        <div class="section-title">
          Escalar k
        </div>

        <input
          id="scalarK"
          type="number"
          value="2"
          step="any"
          oninput="calculateVectors()"
        >

      </div>


      <button class="main-btn" onclick="calculateVectors()">
        Calcular operación
      </button>


      <div class="result vector-result">

        <div class="result-title">
          Resultado vectorial
        </div>

        <div class="result-value" id="vectorResult">
          R = (4, 6)
        </div>

        <div class="result-formula detail" id="vectorDetails">
          Calculando propiedades...
        </div>

      </div>

    </section>

  </div>


  <div class="footer">
    Converti • Herramienta científica
  </div>

</div>


<script>

/* =========================================================
   DATOS DE UNIDADES
========================================================= */

const unitsData = {

  longitud:{
    m:{n:"Metros (m)",f:1},
    km:{n:"Kilómetros (km)",f:1000},
    cm:{n:"Centímetros (cm)",f:.01},
    mm:{n:"Milímetros (mm)",f:.001},
    um:{n:"Micrómetros (µm)",f:.000001},
    nm:{n:"Nanómetros (nm)",f:1e-9},
    mi:{n:"Millas (mi)",f:1609.344},
    yd:{n:"Yardas (yd)",f:.9144},
    ft:{n:"Pies (ft)",f:.3048},
    in:{n:"Pulgadas (in)",f:.0254},
    NM:{n:"Millas náuticas",f:1852}
  },

  masa:{
    kg:{n:"Kilogramos (kg)",f:1},
    g:{n:"Gramos (g)",f:.001},
    mg:{n:"Miligramos (mg)",f:.000001},
    ug:{n:"Microgramos (µg)",f:1e-9},
    t:{n:"Toneladas (t)",f:1000},
    lb:{n:"Libras (lb)",f:.45359237},
    oz:{n:"Onzas (oz)",f:.02834952}
  },

  volumen:{
    l:{n:"Litros (L)",f:1},
    ml:{n:"Mililitros (mL)",f:.001},
    ul:{n:"Microlitros (µL)",f:.000001},
    m3:{n:"Metros cúbicos (m³)",f:1000},
    cm3:{n:"Centímetros cúbicos (cm³)",f:.001},
    gal:{n:"Galones US",f:3.78541},
    floz:{n:"Onzas líquidas",f:.0295735}
  },

  area:{
    m2:{n:"Metros cuadrados (m²)",f:1},
    km2:{n:"Kilómetros cuadrados (km²)",f:1000000},
    cm2:{n:"Centímetros cuadrados (cm²)",f:.0001},
    mm2:{n:"Milímetros cuadrados (mm²)",f:.000001},
    ha:{n:"Hectáreas (ha)",f:10000},
    acre:{n:"Acres",f:4046.856}
  },

  velocidad:{
    ms:{n:"Metros por segundo (m/s)",f:1},
    kmh:{n:"Kilómetros por hora (km/h)",f:.2777777778},
    mph:{n:"Millas por hora (mph)",f:.44704},
    kt:{n:"Nudos (kt)",f:.514444}
  },

  tiempo:{
    s:{n:"Segundos (s)",f:1},
    ms:{n:"Milisegundos (ms)",f:.001},
    min:{n:"Minutos (min)",f:60},
    h:{n:"Horas (h)",f:3600},
    d:{n:"Días (d)",f:86400},
    wk:{n:"Semanas",f:604800},
    yr:{n:"Años (365 días)",f:31536000}
  },

  temperatura:{
    C:{n:"Celsius (°C)"},
    F:{n:"Fahrenheit (°F)"},
    K:{n:"Kelvin (K)"}
  },

  presion:{
    pa:{n:"Pascales (Pa)",f:1},
    kpa:{n:"Kilopascales (kPa)",f:1000},
    mpa:{n:"Megapascales (MPa)",f:1000000},
    bar:{n:"Bar",f:100000},
    psi:{n:"PSI",f:6894.757},
    atm:{n:"Atmósferas (atm)",f:101325}
  },

  almacenamiento:{
    b:{n:"Bytes (B)",f:1},
    kb:{n:"Kilobytes (KB)",f:1024},
    mb:{n:"Megabytes (MB)",f:1048576},
    gb:{n:"Gigabytes (GB)",f:1073741824},
    tb:{n:"Terabytes (TB)",f:1099511627776}
  },

  energia:{
    j:{n:"Joules (J)",f:1},
    kj:{n:"Kilojoules (kJ)",f:1000},
    cal:{n:"Calorías (cal)",f:4.184},
    kcal:{n:"Kilocalorías (kcal)",f:4184},
    kwh:{n:"Kilovatios-hora (kWh)",f:3600000}
  }

};


/* =========================================================
   CAMBIO DE PESTAÑAS
========================================================= */

function switchTab(id,button){

  document.querySelectorAll(".content")
    .forEach(x=>x.classList.remove("active"));

  document.querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id).classList.add("active");

  button.classList.add("active");
}


/* =========================================================
   CARGAR UNIDADES
========================================================= */

function loadUnits(){

  const category =
    document.getElementById("unitCat").value;

  const from =
    document.getElementById("unitFrom");

  const to =
    document.getElementById("unitTo");

  from.innerHTML="";
  to.innerHTML="";

  Object.keys(unitsData[category]).forEach(key=>{

    const unit=unitsData[category][key];

    from.add(
      new Option(unit.n,key)
    );

    to.add(
      new Option(unit.n,key)
    );

  });

  if(to.options.length>1){
    to.selectedIndex=1;
  }

  convertUnits();
}


/* =========================================================
   INTERCAMBIAR UNIDADES
========================================================= */

function swapUnits(){

  const from=
    document.getElementById("unitFrom");

  const to=
    document.getElementById("unitTo");

  const temp=from.value;

  from.value=to.value;
  to.value=temp;

  convertUnits();
}


/* =========================================================
   FORMATEAR NÚMEROS
========================================================= */

function formatNumber(number){

  if(!isFinite(number)) return "Error";

  if(Math.abs(number)>=1e9 ||
     (Math.abs(number)>0 && Math.abs(number)<0.000001)){

    return number.toExponential(6);

  }

  return number.toLocaleString("es-CO",{
    maximumFractionDigits:10
  });

}


/* =========================================================
   CONVERSIÓN
========================================================= */

function convertUnits(){

  const category=
    document.getElementById("unitCat").value;

  const value=
    parseFloat(document.getElementById("unitVal").value);

  const from=
    document.getElementById("unitFrom").value;

  const to=
    document.getElementById("unitTo").value;

  const result=
    document.getElementById("unitResult");

  const formula=
    document.getElementById("unitFormula");


  if(isNaN(value)){

    result.textContent="Introduce un valor";

    formula.textContent=
      "Escribe un número válido.";

    return;

  }


  let converted;


  /* TEMPERATURA */

  if(category==="temperatura"){

    let celsius;

    if(from==="C")
      celsius=value;

    else if(from==="F")
      celsius=(value-32)*5/9;

    else
      celsius=value-273.15;


    if(to==="C")
      converted=celsius;

    else if(to==="F")
      converted=celsius*9/5+32;

    else
      converted=celsius+273.15;

  }


  /* RESTO */

  else{

    const base=
      value*unitsData[category][from].f;

    converted=
      base/unitsData[category][to].f;

  }


  const fromName=
    unitsData[category][from].n;

  const toName=
    unitsData[category][to].n;


  result.textContent=
    `${formatNumber(value)} ${from} = ${formatNumber(converted)} ${to}`;


  formula.textContent=
    `${fromName} → ${toName}`;


  saveHistory(
    `${formatNumber(value)} ${from} = ${formatNumber(converted)} ${to}`
  );

}


/* =========================================================
   HISTORIAL
========================================================= */

let historyData=
  JSON.parse(localStorage.getItem("convertiHistory")||"[]");


function saveHistory(text){

  if(!text || text.includes("undefined"))
    return;

  if(historyData[0]===text)
    return;

  historyData.unshift(text);

  historyData=
    historyData.slice(0,8);

  localStorage.setItem(
    "convertiHistory",
    JSON.stringify(historyData)
  );

  renderHistory();
}


function renderHistory(){

  const list=
    document.getElementById("historyList");

  if(historyData.length===0){

    list.innerHTML=
      `<div class="history-empty">
        No hay conversiones todavía.
      </div>`;

    return;
  }


  list.innerHTML=
    historyData.map(item=>`

      <div class="history-item">
        <strong>${item}</strong>
        <span>Conversión realizada</span>
      </div>

    `).join("");

}


function clearHistory(){

  historyData=[];

  localStorage.removeItem("convertiHistory");

  renderHistory();

}


/* =========================================================
   VECTORES
========================================================= */

function updateVectorFields(){

  const dimension=
    document.getElementById("vecDim").value;

  const operation=
    document.getElementById("vecOp").value;

  const az=
    document.getElementById("az");

  const bz=
    document.getElementById("bz");

  const vectorB=
    document.getElementById("vectorB");

  const scalarBox=
    document.getElementById("scalarBox");


  /* 2D / 3D */

  if(dimension==="3d"){

    az.style.display="block";
    bz.style.display="block";

  }else{

    az.style.display="none";
    bz.style.display="none";

    az.value=0;
    bz.value=0;

  }


  /* ESCALAR */

  if(operation==="mult" ||
     operation==="div"){

    vectorB.style.display="none";
    scalarBox.style.display="block";

  }else{

    vectorB.style.display="block";
    scalarBox.style.display="none";

  }


  calculateVectors();

}


/* =========================================================
   CALCULAR VECTORES
========================================================= */

function calculateVectors(){

  const dimension=
    document.getElementById("vecDim").value;

  const operation=
    document.getElementById("vecOp").value;


  const ax=
    parseFloat(document.getElementById("ax").value)||0;

  const ay=
    parseFloat(document.getElementById("ay").value)||0;

  const az=
    dimension==="3d"
      ?parseFloat(document.getElementById("az").value)||0
      :0;


  const bx=
    parseFloat(document.getElementById("bx").value)||0;

  const by=
    parseFloat(document.getElementById("by").value)||0;

  const bz=
    dimension==="3d"
      ?parseFloat(document.getElementById("bz").value)||0
      :0;


  const k=
    parseFloat(document.getElementById("scalarK").value)||0;


  const result=
    document.getElementById("vectorResult");

  const details=
    document.getElementById("vectorDetails");


  let rx=0;
  let ry=0;
  let rz=0;

  let scalar=null;


  /* SUMA */

  if(operation==="add"){

    rx=ax+bx;
    ry=ay+by;
    rz=az+bz;

  }


  /* RESTA */

  else if(operation==="sub"){

    rx=ax-bx;
    ry=ay-by;
    rz=az-bz;

  }


  /* MULTIPLICACIÓN */

  else if(operation==="mult"){

    rx=ax*k;
    ry=ay*k;
    rz=az*k;

  }


  /* DIVISIÓN */

  else if(operation==="div"){

    if(k===0){

      result.textContent=
        "Error: división por cero";

      details.textContent=
        "El escalar k no puede ser 0.";

      return;

    }

    rx=ax/k;
    ry=ay/k;
    rz=az/k;

  }


  /* PRODUCTO PUNTO */

  else if(operation==="dot"){

    scalar=
      ax*bx+
      ay*by+
      az*bz;

  }


  /* PRODUCTO CRUZ */

  else if(operation==="cross"){

    if(dimension==="2d"){

      scalar=
        ax*by-
        ay*bx;

    }else{

      rx=
        ay*bz-
        az*by;

      ry=
        az*bx-
        ax*bz;

      rz=
        ax*by-
        ay*bx;

    }

  }


  /* RESULTADO ESCALAR */

  if(scalar!==null){

    if(operation==="cross" &&
       dimension==="2d"){

      result.textContent=
        `R = (0, 0, ${formatNumber(scalar)})`;

      details.innerHTML=`
        Magnitud del componente Z:
        <b>${formatNumber(Math.abs(scalar))}</b><br>

        Producto cruz 2D:
        <b>A × B = ${formatNumber(scalar)} k</b>
      `;

      return;

    }


    result.textContent=
      `A · B = ${formatNumber(scalar)}`;


    const magA=
      Math.sqrt(
        ax*ax+
        ay*ay+
        az*az
      );

    const magB=
      Math.sqrt(
        bx*bx+
        by*by+
        bz*bz
      );


    let angle="";


    if(magA>0 && magB>0){

      let cos=
        scalar/(magA*magB);

      cos=
        Math.max(-1,Math.min(1,cos));

      const theta=
        Math.acos(cos)*180/Math.PI;

      angle=
        `<br>Ángulo entre A y B:
        <b>${theta.toFixed(2)}°</b>`;

    }


    details.innerHTML=`

      Magnitud |A| =
      <b>${magA.toFixed(4)}</b><br>

      Magnitud |B| =
      <b>${magB.toFixed(4)}</b>

      ${angle}

    `;

    return;

  }


  /* RESULTADO VECTORIAL */

  const magnitude=
    Math.sqrt(
      rx*rx+
      ry*ry+
      rz*rz
    );


  if(dimension==="3d"){

    result.textContent=
      `R = (${formatNumber(rx)}, ${formatNumber(ry)}, ${formatNumber(rz)})`;

  }else{

    result.textContent=
      `R = (${formatNumber(rx)}, ${formatNumber(ry)})`;

  }


  /* VECTOR UNITARIO */

  let unit="N/A";


  if(magnitude>0){

    if(dimension==="3d"){

      unit=
        `(${(rx/magnitude).toFixed(4)}i + `+
        `${(ry/magnitude).toFixed(4)}j + `+
        `${(rz/magnitude).toFixed(4)}k)`;

    }else{

      unit=
        `(${(rx/magnitude).toFixed(4)}i + `+
        `${(ry/magnitude).toFixed(4)}j)`;

    }

  }


  /* ÁNGULO 2D */

  let angleText="";


  if(dimension==="2d" &&
     magnitude>0){

    let angle=
      Math.atan2(ry,rx)*180/Math.PI;

    if(angle<0)
      angle+=360;

    angleText=
      `<br>Dirección θ =
      <b>${angle.toFixed(2)}°</b>`;

  }


  details.innerHTML=`

    Magnitud |R| =
    <b>${magnitude.toFixed(4)}</b>

    ${angleText}

    <br>

    Vector unitario:
    <b>û = ${unit}</b>

  `;

}


/* =========================================================
   TEMA CLARO / OSCURO
========================================================= */

function toggleTheme(){

  document.body.classList.toggle("dark");

  const dark=
    document.body.classList.contains("dark");

  document.getElementById("themeBtn").textContent=
    dark?"☀️":"🌙";

  localStorage.setItem(
    "convertiTheme",
    dark?"dark":"light"
  );

}


/* =========================================================
   CARGAR TEMA
========================================================= */

if(localStorage.getItem("convertiTheme")==="dark"){

  document.body.classList.add("dark");

  document.getElementById("themeBtn").textContent="☀️";

}


/* =========================================================
   INICIO
========================================================= */

loadUnits();

updateVectorFields();

renderHistory();

</script>
