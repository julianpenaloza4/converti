<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Converti — Conversor de unidades</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e5e7eb;
  --accent:#6d5dfc;--accent2:#8b7cff;--soft:#f0edff;--danger:#ef4444;
  --shadow:0 18px 50px rgba(16,24,40,.10);--radius:24px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(circle at 10% 0%,#e9e5ff 0,transparent 28%),var(--bg);color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer;border:0}
.app{max-width:1120px;margin:auto;padding:28px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;
background:linear-gradient(135deg,var(--accent),#a38cff);color:#fff;display:grid;place-items:center;
font-size:23px;font-weight:800;box-shadow:0 10px 25px #6d5dfc35}.brand h1{margin:0;font-size:23px}.brand span{color:var(--muted);font-size:12px}
.icon{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:18px}
.hero{padding:18px 2px 24px}.hero h2{font-size:clamp(32px,6vw,52px);letter-spacing:-2px;margin:0 0 8px}
.hero p{margin:0;color:var(--muted);font-size:16px}
.layout{display:grid;grid-template-columns:1fr 310px;gap:22px}
.main,.side{background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border:1px solid #ffffffaa;box-shadow:var(--shadow);border-radius:var(--radius)}
.main{padding:22px}.side{padding:20px;height:max-content}
.categories{display:flex;gap:9px;overflow:auto;padding:2px 0 15px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:10px 14px;border-radius:13px;background:#f7f7fa;color:#475467;border:1px solid var(--line)}
.cat.active{background:var(--soft);color:var(--accent);border-color:#d9d3ff;font-weight:700}
.card{border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:6px}
.select-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.row{display:grid;grid-template-columns:1fr 54px 1fr;gap:10px;align-items:end}
select,input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;color:var(--text);outline:none}
select:focus,input:focus{border-color:#aaa0ff;box-shadow:0 0 0 4px #6d5dfc14}
.swap{height:48px;border-radius:15px;background:#111827;color:#fff;font-size:20px;transition:.2s}
.swap:hover{transform:rotate(180deg)}
.value{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-1px;margin-top:18px}
.result-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.copy{padding:9px 13px;border-radius:11px;background:#f3f4f6;color:#344054}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.quick button{background:#f8f9fc;border:1px solid var(--line);padding:8px 11px;border-radius:10px;color:#475467}
.section-title{font-weight:800;margin:0 0 14px}.history-item{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.history-item:last-child{border-bottom:0}.history-item strong{display:block}.empty{color:var(--muted);font-size:14px}
.side-head{display:flex;justify-content:space-between;align-items:center}.clear{background:none;color:var(--accent);font-size:12px}
.fav{margin-top:22px}.fav-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.star{color:#f59e0b}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
.dark{--bg:#0b1020;--card:#121a2b;--text:#f8fafc;--muted:#98a2b3;--line:#263148;--soft:#28234f}
.dark .cat,.dark select,.dark input,.dark .quick button,.dark .copy,.dark .icon{background:#182235;color:var(--text)}
.dark .main,.dark .side{background:rgba(18,26,43,.9)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:2}.app{padding:18px 14px 35px}.main{padding:16px}.hero{padding-top:10px}.row{grid-template-columns:1fr 46px 1fr}}
@media(max-width:500px){.row{grid-template-columns:1fr;gap:9px}.swap{width:100%;height:40px}.value{font-size:34px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">↔</div><div><h1>Converti</h1><span>Conversor inteligente</span></div></div>
    <button class="icon" id="theme" aria-label="Cambiar tema">☾</button>
  </header>

  <section class="hero"><h2>Convierte cualquier unidad.</h2><p>Rápido, preciso y pensado para usarlo desde tu celular.</p></section>

  <div class="layout">
    <main class="main">
      <div class="categories" id="categories"></div>
      <div class="card">
        <div class="row">
          <div><div class="select-label">De</div><select id="from"></select></div>
          <button class="swap" id="swap">⇄</button>
          <div><div class="select-label">A</div><select id="to"></select></div>
        </div>
        <div style="margin-top:17px"><div class="select-label">Cantidad</div><input id="amount" type="number" inputmode="decimal" value="1" step="any"></div>
        <div class="result-line"><div class="value" id="result">—</div><button class="copy" id="copy">Copiar</button></div>
        <div class="quick" id="quick"></div>
      </div>
    </main>

    <aside class="side">
      <div class="side-head"><h3 class="section-title">Historial</h3><button class="clear" id="clear">Borrar todo</button></div>
      <div id="history" class="empty">Tus conversiones recientes aparecerán aquí.</div>
      <div class="fav"><h3 class="section-title">Favoritos</h3>
        <div class="fav-item"><span>Longitud</span><span class="star">★</span></div>
        <div class="fav-item"><span>Masa</span><span class="star">★</span></div>
      </div>
    </aside>
  </div>
  <div class="footer">Converti · Conversión instantánea · Funciona sin recargar la página</div>
</div>

<script>
const data={
 "Longitud":{units:{Metro:1,Kilómetro:1000,Centímetro:.01,Milímetro:.001,Milla:1609.344,Yarda:.9144,Pie:.3048,Pulgada:.0254},quick:["Metro","Kilómetro","Centímetro","Pie","Pulgada"]},
 "Masa":{units:{Kilogramo:1,Gramo:.001,Milígramo:.000001,Tonelada:1000,Libra:.45359237,Onza:.0283495231},quick:["Kilogramo","Gramo","Libra","Onza"]},
 "Temperatura":{units:{Celsius:"C",Fahrenheit:"F",Kelvin:"K"},quick:["Celsius","Fahrenheit","Kelvin"]},
 "Volumen":{units:{Litro:1,Mililitro:.001,Metro³:1000,Galón:3.785411784,Taza:.2365882365},quick:["Litro","Mililitro","Galón","Taza"]},
 "Área":{units:{"Metro²":1,"Kilómetro²":1e6,"Hectárea":1e4,"Centímetro²":1e-4,"Pie²":.09290304},quick:["Metro²","Hectárea","Kilómetro²","Pie²"]},
 "Velocidad":{units:{"km/h":1,"m/s":3.6,"mph":1.609344,"nudo":1.852},quick:["km/h","m/s","mph","nudo"]},
 "Almacenamiento":{units:{Byte:1,"Kilobyte":1024,"Megabyte":1048576,"Gigabyte":1073741824,"Terabyte":1099511627776},quick:["Byte","Kilobyte","Megabyte","Gigabyte"]},
 "Tiempo":{units:{Segundo:1,Minuto:60,Hora:3600,Día:86400,Semana:604800},quick:["Segundo","Minuto","Hora","Día"]},
 "Presión":{units:{Pascal:1,kPa:1000,Bar:100000,PSI:6894.757293,Atmósfera:101325},quick:["Pascal","kPa","Bar","PSI"]}
};
let category="Longitud", history=JSON.parse(localStorage.getItem("convertiHistory")||"[]");
const $=id=>document.getElementById(id);
function populateCats(){
  $("categories").innerHTML=Object.keys(data).map(c=>`<button class="cat ${c===category?"active":""}" data-c="${c}">${c}</button>`).join("");
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{category=b.dataset.c;populateCats();populateUnits();convert()});
}
function populateUnits(){
  const names=Object.keys(data[category].units);
  $("from").innerHTML=names.map(x=>`<option>${x}</option>`).join("");
  $("to").innerHTML=names.map((x,i)=>`<option ${i===1?"selected":""}>${x}</option>`).join("");
  $("quick").innerHTML=data[category].quick.map(x=>`<button data-q="${x}">${x}</button>`).join("");
  document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{$("to").value=b.dataset.q;convert()});
}
function temp(v,a,b){let c=a==="C"?v:a==="F"?(v-32)*5/9:v-273.15;return b==="C"?c:b==="F"?c*9/5+32:c+273.15}
function convert(){
 const v=parseFloat($("amount").value); if(!Number.isFinite(v)){ $("result").textContent="—";return}
 const a=$("from").value,b=$("to").value;
 let out;
 if(category==="Temperatura") out=temp(v,data[category].units[a],data[category].units[b]);
 else out=v*data[category].units[a]/data[category].units[b];
 const pretty=Math.abs(out)>=1000?out.toLocaleString("es-CO",{maximumFractionDigits:6}):out.toLocaleString("es-CO",{maximumFractionDigits:8});
 $("result").textContent=pretty+" "+b;
}
function addHistory(){
 const v=parseFloat($("amount").value);if(!Number.isFinite(v))return;
 const item=`${v} ${$("from").value} → ${$("result").textContent}`;
 history=[item,...history.filter(x=>x!==item)].slice(0,8);localStorage.setItem("convertiHistory",JSON.stringify(history));renderHistory();
}
function renderHistory(){$("history").innerHTML=history.length?history.map(x=>`<div class="history-item"><strong>${x}</strong><span>${category}</span></div>`).join(""):`<span class="empty">Tus conversiones recientes aparecerán aquí.</span>`}
["amount","from","to"].forEach(id=>$(id).addEventListener("input",()=>{convert();}));
["from","to"].forEach(id=>$(id).addEventListener("change",()=>{convert();addHistory()}));
$("swap").onclick=()=>{let x=$("from").value;$("from").value=$("to").value;$("to").value=x;convert();addHistory()};
$("copy").onclick=async()=>{await navigator.clipboard?.writeText($("result").textContent);$("copy").textContent="¡Copiado!";setTimeout(()=>$("copy").textContent="Copiar",1000)};
$("clear").onclick=()=>{history=[];localStorage.removeItem("convertiHistory");renderHistory()};
$("theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("convertiDark",document.body.classList.contains("dark"));$("theme").textContent=document.body.classList.contains("dark")?"☀":"☾"};
if(localStorage.getItem("convertiDark")==="true"){document.body.classList.add("dark");$("theme").textContent="☀"}
populateCats();populateUnits();renderHistory();convert();
</script>
</body>
</html>
