<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f5ff">
<title>Converti — Conversor de unidades</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f5f4ff;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --primary:#7657f6;
  --primary2:#9478ff;
  --border:#e7e5ef;
  --input:#fafaff;
  --shadow:0 18px 50px rgba(55,42,120,.10);
}

body.dark{
  --bg:#0d0f16;
  --card:#171a23;
  --text:#f5f7ff;
  --muted:#9ca3af;
  --primary:#8b72ff;
  --primary2:#a28eff;
  --border:#292d39;
  --input:#11141c;
  --shadow:0 18px 50px rgba(0,0,0,.3);
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  transition:.25s;
}

.app{
  width:min(100%,760px);
  margin:auto;
  padding:calc(22px + env(safe-area-inset-top)) 18px 40px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:54px;
  height:54px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  font-size:29px;
  font-weight:800;
  box-shadow:0 12px 28px rgba(118,87,246,.28);
}

.brand h1{
  font-size:23px;
  margin:0;
  letter-spacing:-.6px;
}

.brand p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:14px;
}

.theme{
  width:48px;
  height:48px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:21px;
}

/* HERO */

.hero{
  margin-bottom:24px;
}

.hero h2{
  margin:0;
  font-size:clamp(36px,9vw,60px);
  line-height:.98;
  letter-spacing:-2.8px;
  max-width:650px;
}

.hero p{
  margin:14px 0 0;
  color:var(--muted);
  font-size:18px;
  line-height:1.4;
}

/* CATEGORIES */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 2px 11px;
}

.section-title h3{
  margin:0;
  font-size:16px;
}

.section-title span{
  color:var(--muted);
  font-size:13px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.category{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:15px 13px;
  border-radius:18px;
  text-align:left;
  font-size:15px;
  font-weight:650;
  display:flex;
  align-items:center;
  gap:10px;
  transition:.2s;
}

.category.active{
  border-color:var(--primary);
  background:rgba(118,87,246,.10);
  color:var(--primary);
}

.category .icon{
  font-size:21px;
}

/* CONVERTER */

.converter{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:20px;
  margin-top:15px;
  box-shadow:var(--shadow);
}

.field-label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  letter-spacing:1.3px;
  margin:4px 3px 8px;
}

.select-wrap{
  position:relative;
}

select,input{
  width:100%;
  height:58px;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--input);
  color:var(--text);
  font-size:17px;
  outline:none;
  padding:0 16px;
  appearance:auto;
}

input{
  font-size:22px;
  font-weight:600;
}

select:focus,input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(118,87,246,.12);
}

.swap{
  width:100%;
  height:52px;
  margin:13px 0;
  border:0;
  border-radius:16px;
  background:#101727;
  color:white;
  font-size:25px;
}

body.dark .swap{
  background:#292d3b;
}

.result{
  margin-top:16px;
  padding:19px;
  border-radius:20px;
  background:linear-gradient(135deg,rgba(118,87,246,.12),rgba(148,120,255,.06));
  border:1px solid rgba(118,87,246,.16);
}

.result small{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
}

.result-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:7px;
}

.result-value{
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
  overflow-wrap:anywhere;
}

.copy{
  flex:none;
  border:0;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:13px;
  padding:11px 14px;
  font-weight:700;
}

.form-row{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
}

.from-block{
  margin-bottom:2px;
}

/* HISTORY */

.history{
  margin-top:26px;
}

.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.history h3{
  margin:0;
  font-size:20px;
}

.clear{
  border:0;
  background:transparent;
  color:var(--primary);
  font-weight:700;
}

.history-list{
  margin-top:12px;
  display:grid;
  gap:9px;
}

.history-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:13px 15px;
}

.history-item strong{
  display:block;
  font-size:15px;
}

.history-item span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.empty{
  color:var(--muted);
  background:var(--card);
  border:1px dashed var(--border);
  border-radius:17px;
  padding:18px;
  text-align:center;
  font-size:14px;
}

/* FOOTER */

footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:30px 0 10px;
}

/* DESKTOP */

@media(min-width:600px){
  .categories{
    grid-template-columns:repeat(4,1fr);
  }

  .form-row{
    grid-template-columns:1fr 1fr;
  }

  .swap{
    margin:15px 0;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">
    <div class="logo">↔</div>
    <div>
      <h1>Converti</h1>
      <p>Conversor inteligente</p>
    </div>
  </div>

  <button class="theme" id="themeBtn" aria-label="Cambiar tema">🌙</button>
</header>

<section class="hero">
  <h2>Convierte cualquier unidad.</h2>
  <p>Rápido, preciso y diseñado para usarlo cómodamente desde tu celular.</p>
</section>

<div class="section-title">
  <h3>Categoría</h3>
  <span id="categoryName">Longitud</span>
</div>

<div class="categories" id="categories"></div>

<section class="converter">

  <div class="form-row">

    <div class="from-block">
      <label class="field-label">DE</label>
      <select id="from"></select>
    </div>

    <div>
      <label class="field-label">A</label>
      <select id="to"></select>
    </div>

  </div>

  <button class="swap" id="swap">⇄</button>

  <label class="field-label">CANTIDAD</label>
  <input id="amount" type="number" inputmode="decimal" value="1" placeholder="Escribe una cantidad">

  <div class="result">
    <small>RESULTADO</small>

    <div class="result-row">
      <div class="result-value" id="result">—</div>
      <button class="copy" id="copy">Copiar</button>
    </div>
  </div>

</section>

<section class="history">

  <div class="history-head">
    <h3>Conversiones recientes</h3>
    <button class="clear" id="clear">Limpiar</button>
  </div>

  <div class="history-list" id="history"></div>

</section>

<footer>
  Converti · Conversor de unidades
</footer>

</div>

<script>

const units = {

  longitud:{
    name:"Longitud",
    icon:"📏",
    units:{
      "Milímetros":"mm",
      "Centímetros":"cm",
      "Metros":"m",
      "Kilómetros":"km",
      "Pulgadas":"in",
      "Pies":"ft",
      "Yardas":"yd",
      "Millas":"mi"
    },
    base:{
      mm:0.001,
      cm:0.01,
      m:1,
      km:1000,
      in:0.0254,
      ft:0.3048,
      yd:0.9144,
      mi:1609.344
    }
  },

  masa:{
    name:"Masa",
    icon:"⚖️",
    units:{
      "Miligramos":"mg",
      "Gramos":"g",
      "Kilogramos":"kg",
      "Toneladas":"t",
      "Onzas":"oz",
      "Libras":"lb"
    },
    base:{
      mg:0.000001,
      g:0.001,
      kg:1,
      t:1000,
      oz:0.028349523125,
      lb:0.45359237
    }
  },

  temperatura:{
    name:"Temperatura",
    icon:"🌡️",
    units:{
      "Celsius":"c",
      "Fahrenheit":"f",
      "Kelvin":"k"
    }
  },

  area:{
    name:"Área",
    icon:"📐",
    units:{
      "Metros cuadrados":"m2",
      "Kilómetros cuadrados":"km2",
      "Centímetros cuadrados":"cm2",
      "Pies cuadrados":"ft2",
      "Hectáreas":"ha",
      "Acres":"acre"
    },
    base:{
      m2:1,
      km2:1000000,
      cm2:0.0001,
      ft2:0.09290304,
      ha:10000,
      acre:4046.8564224
    }
  },

  volumen:{
    name:"Volumen",
    icon:"🧴",
    units:{
      "Mililitros":"ml",
      "Litros":"l",
      "Metros cúbicos":"m3",
      "Galones":"gal",
      "Tazas":"cup"
    },
    base:{
      ml:0.001,
      l:1,
      m3:1000,
      gal:3.785411784,
      cup:0.2365882365
    }
  },

  velocidad:{
    name:"Velocidad",
    icon:"🚗",
    units:{
      "Metros por segundo":"ms",
      "Kilómetros por hora":"kmh",
      "Millas por hora":"mph",
      "Nudos":"kn"
    },
    base:{
      ms:1,
      kmh:0.2777777778,
      mph:0.44704,
      kn:0.5144444444
    }
  },

  tiempo:{
    name:"Tiempo",
    icon:"⏱️",
    units:{
      "Milisegundos":"ms",
      "Segundos":"s",
      "Minutos":"min",
      "Horas":"h",
      "Días":"day",
      "Semanas":"week"
    },
    base:{
      ms:0.001,
      s:1,
      min:60,
      h:3600,
      day:86400,
      week:604800
    }
  },

  datos:{
    name:"Datos",
    icon:"💾",
    units:{
      "Bytes":"b",
      "Kilobytes":"kb",
      "Megabytes":"mb",
      "Gigabytes":"gb",
      "Terabytes":"tb"
    },
    base:{
      b:1,
      kb:1024,
      mb:1048576,
      gb:1073741824,
      tb:1099511627776
    }
  },

  presion:{
    name:"Presión",
    icon:"🧪",
    units:{
      "Pascales":"pa",
      "Kilopascales":"kpa",
      "Bar":"bar",
      "Atmósferas":"atm",
      "PSI":"psi"
    },
    base:{
      pa:1,
      kpa:1000,
      bar:100000,
      atm:101325,
      psi:6894.757293
    }
  }

};

let current="longitud";

const categories=document.getElementById("categories");
const from=document.getElementById("from");
const to=document.getElementById("to");
const amount=document.getElementById("amount");
const result=document.getElementById("result");
const historyBox=document.getElementById("history");
const categoryName=document.getElementById("categoryName");

function buildCategories(){

  categories.innerHTML="";

  Object.entries(units).forEach(([key,data])=>{

    const button=document.createElement("button");

    button.className="category"+(key===current?" active":"");

    button.innerHTML=
      `<span class="icon">${data.icon}</span>
       <span>${data.name}</span>`;

    button.onclick=()=>{
      current=key;
      categoryName.textContent=data.name;
      buildCategories();
      loadUnits();
      convert();
    };

    categories.appendChild(button);

  });

}

function loadUnits(){

  const data=units[current];

  from.innerHTML="";
  to.innerHTML="";

  Object.entries(data.units).forEach(([name,value])=>{

    from.add(new Option(name,value));
    to.add(new Option(name,value));

  });

  if(to.options.length>1) to.selectedIndex=1;

}

function temperatureConvert(value,fromUnit,toUnit){

  let celsius;

  if(fromUnit==="c") celsius=value;
  if(fromUnit==="f") celsius=(value-32)*5/9;
  if(fromUnit==="k") celsius=value-273.15;

  if(toUnit==="c") return celsius;
  if(toUnit==="f") return celsius*9/5+32;
  if(toUnit==="k") return celsius+273.15;

}

function convert(){

  const value=parseFloat(amount.value);

  if(Number.isNaN(value)){
    result.textContent="—";
    return;
  }

  let converted;

  if(current==="temperatura"){

    converted=temperatureConvert(
      value,
      from.value,
      to.value
    );

  }else{

    const base=units[current].base;

    converted=value*base[from.value]/base[to.value];

  }

  const toName=from.options[to.selectedIndex].text;

  const formatted=new Intl.NumberFormat("es-CO",{
    maximumFractionDigits:10
  }).format(converted);

  result.textContent=formatted+" "+toName;

}

function saveHistory(){

  const value=parseFloat(amount.value);

  if(Number.isNaN(value)) return;

  const data=units[current];

  const fromName=from.options[from.selectedIndex].text;
  const toName=to.options[to.selectedIndex].text;

  let converted;

  if(current==="temperatura"){
    converted=temperatureConvert(value,from.value,to.value);
  }else{
    converted=value*data.base[from.value]/data.base[to.value];
  }

  const item={
    text:`${value} ${fromName} → ${converted} ${toName}`,
    date:new Date().toLocaleTimeString("es-CO",{
      hour:"2-digit",
      minute:"2-digit"
    })
  };

  let history=JSON.parse(localStorage.getItem("convertiHistory")||"[]");

  history.unshift(item);

  history=history.slice(0,10);

  localStorage.setItem("convertiHistory",JSON.stringify(history));

  renderHistory();

}

function renderHistory(){

  let history=JSON.parse(localStorage.getItem("convertiHistory")||"[]");

  if(!history.length){

    historyBox.innerHTML=
      `<div class="empty">Tus conversiones recientes aparecerán aquí.</div>`;

    return;

  }

  historyBox.innerHTML=history.map(item=>
    `<div class="history-item">
      <strong>${item.text}</strong>
      <span>${item.date}</span>
    </div>`
  ).join("");

}

from.addEventListener("change",convert);
to.addEventListener("change",convert);

amount.addEventListener("input",convert);

amount.addEventListener("change",saveHistory);

document.getElementById("swap").onclick=()=>{

  const temp=from.value;

  from.value=to.value;
  to.value=temp;

  convert();

};

document.getElementById("copy").onclick=async()=>{

  const text=result.textContent;

  if(text==="—") return;

  try{
    await navigator.clipboard.writeText(text);
    document.getElementById("copy").textContent="¡Copiado!";
    setTimeout(()=>{
      document.getElementById("copy").textContent="Copiar";
    },1200);
  }catch(e){
    alert("Resultado: "+text);
  }

};

document.getElementById("clear").onclick=()=>{

  localStorage.removeItem("convertiHistory");
  renderHistory();

};

document.getElementById("themeBtn").onclick=()=>{

  document.body.classList.toggle("dark");

  const dark=document.body.classList.contains("dark");

  localStorage.setItem("convertiDark",dark);

  document.getElementById("themeBtn").textContent=
    dark?"☀️":"🌙";

};

if(localStorage.getItem("convertiDark")==="true"){

  document.body.classList.add("dark");
  document.getElementById("themeBtn").textContent="☀️";

}

buildCategories();
loadUnits();
renderHistory();
convert();

</script>

</body>
</html>
