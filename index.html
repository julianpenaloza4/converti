<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor Avanzado - Física & Matemáticas</title>
  <!-- Fuente moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: rgba(20, 20, 23, 0.75);
      --accent-red: #ef4444;
      --accent-red-hover: #dc2626;
      --accent-red-glow: rgba(239, 68, 68, 0.35);
      --input-bg: #18181b;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #ef4444;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s ease;
    }

    body {
      background-color: var(--bg-color);
      /* Destellos rojos ambientales en el fondo */
      background-image: 
        radial-gradient(at 15% 15%, rgba(239, 68, 68, 0.12) 0px, transparent 45%),
        radial-gradient(at 85% 85%, rgba(239, 68, 68, 0.08) 0px, transparent 45%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--text-main);
    }

    /* Tarjeta Glassmorphism */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 32px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(239, 68, 68, 0.05);
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Tabs Segmentados Estilo Píldora */
    .tabs-track {
      display: flex;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 10px;
    }

    .tab-btn.active {
      background: var(--accent-red);
      color: #ffffff;
      box-shadow: 0 4px 15px var(--accent-red-glow);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Campos de Entrada */
    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-muted);
      font-size: 13px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-red-glow);
    }

    select option {
      background-color: #18181b;
      color: var(--text-main);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Botón Principal */
    button.btn-calc {
      width: 100%;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 20px var(--accent-red-glow);
    }

    button.btn-calc:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.5);
    }

    button.btn-calc:active {
      transform: translateY(1px);
    }

    /* Área de Resultado */
    .result {
      margin-top: 20px;
      padding: 16px;
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid var(--accent-red);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.6;
    }

    .result strong {
      color: #ffffff;
    }

    .result b {
      color: var(--accent-red);
      font-size: 16px;
    }

    .sub-title {
      font-weight: 600;
      font-size: 13px;
      margin-top: 16px;
      margin-bottom: 10px;
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>Física & Vectores</h2>
    <p>Convertidor de precisión y cálculo vectorial</p>
  </div>
  
  <!-- Navegación por pestañas -->
  <div class="tabs-track">
    <button class="tab-btn active" onclick="cambiarPestana('unidades', event)">Unidades</button>
    <button class="tab-btn" onclick="cambiarPestana('vectores', event)">Vectores</button>
  </div>

  <!-- PESTAÑA 1: UNIDADES -->
  <div id="unidades" class="tab-content active">
    <div class="form-group">
      <label for="categoria">Categoría</label>
      <select id="categoria" onchange="actualizarUnidades()">
        <option value="longitud">Longitud</option>
        <option value="temperatura">Temperatura</option>
        <option value="masa">Masa / Peso</option>
      </select>
    </div>

    <div class="form-group">
      <label for="valor">Valor a convertir</label>
      <input type="number" id="valor" value="1" step="any">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="deUnidad">De</label>
        <select id="deUnidad"></select>
      </div>

      <div class="form-group">
        <label for="aUnidad">A</label>
        <select id="aUnidad"></select>
      </div>
    </div>

    <button class="btn-calc" onclick="convertirUnidades()">Convertir Ahora</button>
    <div id="resUnidades" class="result">Ingresa los datos y presiona Convertir.</div>
  </div>

  <!-- PESTAÑA 2: VECTORES -->
  <div id="vectores" class="tab-content">
    <div class="form-group">
      <label for="modoVector">Operación vectorial</label>
      <select id="modoVector" onchange="cambiarModoVector()">
        <option value="polarACartesiano">Polar a Cartesiano (M, θ → X, Y)</option>
        <option value="cartesianoAPolar">Cartesiano a Polar (X, Y → M, θ)</option>
        <option value="sumaVectores">Suma de 2 Vectores (V1 + V2)</option>
      </select>
    </div>

    <!-- Campos Dinámicos -->
    <div id="camposVector"></div>

    <button class="btn-calc" onclick="calcularVectores()">Calcular Vector</button>
    <div id="resVectores" class="result">Ingresa los parámetros del vector.</div>
  </div>
</div>

<script>
  // ==================== LÓGICA DE UNIDADES ====================
  const unidades = {
    longitud: {
      'm': { nombre: 'Metros (m)', factor: 1 },
      'km': { nombre: 'Kilómetros (km)', factor: 1000 },
      'cm': { nombre: 'Centímetros (cm)', factor: 0.01 },
      'mm': { nombre: 'Milímetros (mm)', factor: 0.001 },
      'mi': { nombre: 'Millas (mi)', factor: 1609.34 },
      'ft': { nombre: 'Pies (ft)', factor: 0.3048 },
      'in': { nombre: 'Pulgadas (in)', factor: 0.0254 }
    },
    masa: {
      'kg': { nombre: 'Kilogramos (kg)', factor: 1 },
      'g': { nombre: 'Gramos (g)', factor: 0.001 },
      'lb': { nombre: 'Libras (lb)', factor: 0.453592 },
      'oz': { nombre: 'Onzas (oz)', factor: 0.0283495 }
    },
    temperatura: {
      'C': { nombre: 'Celsius (°C)' },
      'F': { nombre: 'Fahrenheit (°F)' },
      'K': { nombre: 'Kelvin (K)' }
    }
  };

  function actualizarUnidades() {
    const cat = document.getElementById('categoria').value;
    const deSelect = document.getElementById('deUnidad');
    const aSelect = document.getElementById('aUnidad');
    
    deSelect.innerHTML = '';
    aSelect.innerHTML = '';

    Object.keys(unidades[cat]).forEach(clave => {
      deSelect.appendChild(new Option(unidades[cat][clave].nombre, clave));
      aSelect.appendChild(new Option(unidades[cat][clave].nombre, clave));
    });

    if (aSelect.options.length > 1) aSelect.selectedIndex = 1;
  }

  function convertirUnidades() {
    const cat = document.getElementById('categoria').value;
    const val = parseFloat(document.getElementById('valor').value);
    const de = document.getElementById('deUnidad').value;
    const a = document.getElementById('aUnidad').value;
    const resDiv = document.getElementById('resUnidades');

    if (isNaN(val)) return resDiv.textContent = "Por favor ingresa un número válido.";

    let resultado = 0;
    if (cat === 'temperatura') {
      let celsius = val;
      if (de === 'F') celsius = (val - 32) * 5 / 9;
      if (de === 'K') celsius = val - 273.15;

      if (a === 'C') resultado = celsius;
      else if (a === 'F') resultado = (celsius * 9 / 5) + 32;
      else if (a === 'K') resultado = celsius + 273.15;
    } else {
      const enBase = val * unidades[cat][de].factor;
      resultado = enBase / unidades[cat][a].factor;
    }

    resDiv.innerHTML = `<strong>Resultado:</strong><br>${val} ${de} = <b>${resultado.toFixed(4)}</b> ${a}`;
  }

  // ==================== LÓGICA DE VECTORES ====================
  function cambiarModoVector() {
    const modo = document.getElementById('modoVector').value;
    const contenedor = document.getElementById('camposVector');

    if (modo === 'polarACartesiano') {
      contenedor.innerHTML = `
        <div class="grid-2">
          <div class="form-group"><label>Magnitud (|V|)</label><input type="number" id="vMag" value="10" step="any"></div>
          <div class="form-group"><label>Ángulo θ (°)</label><input type="number" id="vAng" value="45" step="any"></div>
        </div>`;
    } else if (modo === 'cartesianoAPolar') {
      contenedor.innerHTML = `
        <div class="grid-2">
          <div class="form-group"><label>Componente X (Vx)</label><input type="number" id="vX" value="3" step="any"></div>
          <div class="form-group"><label>Componente Y (Vy)</label><input type="number" id="vY" value="4" step="any"></div>
        </div>`;
    } else if (modo === 'sumaVectores') {
      contenedor.innerHTML = `
        <div class="sub-title">Vector A</div>
        <div class="grid-2">
          <div class="form-group"><label>Ax</label><input type="number" id="ax" value="2" step="any"></div>
          <div class="form-group"><label>Ay</label><input type="number" id="ay" value="5" step="any"></div>
        </div>
        <div class="sub-title">Vector B</div>
        <div class="grid-2">
          <div class="form-group"><label>Bx</label><input type="number" id="bx" value="4" step="any"></div>
          <div class="form-group"><label>By</label><input type="number" id="by" value="-1" step="any"></div>
        </div>`;
    }
  }

  function calcularVectores() {
    const modo = document.getElementById('modoVector').value;
    const resDiv = document.getElementById('resVectores');

    if (modo === 'polarACartesiano') {
      const r = parseFloat(document.getElementById('vMag').value);
      const angDeg = parseFloat(document.getElementById('vAng').value);
      const rad = angDeg * (Math.PI / 180);

      const vx = r * Math.cos(rad);
      const vy = r * Math.sin(rad);

      resDiv.innerHTML = `
        <strong>Componentes Rectangulares:</strong><br>
        Vx = <b>${vx.toFixed(4)}</b><br>
        Vy = <b>${vy.toFixed(4)}</b><br>
        <span style="color: var(--text-muted); font-size: 13px;">Forma vectorial: (${vx.toFixed(2)}i + ${vy.toFixed(2)}j)</span>`;
    } 
    else if (modo === 'cartesianoAPolar') {
      const x = parseFloat(document.getElementById('vX').value);
      const y = parseFloat(document.getElementById('vY').value);

      const r = Math.sqrt(x*x + y*y);
      let angDeg = Math.atan2(y, x) * (180 / Math.PI);
      if (angDeg < 0) angDeg += 360;

      resDiv.innerHTML = `
        <strong>Forma Polar:</strong><br>
        Magnitud (|V|) = <b>${r.toFixed(4)}</b><br>
        Ángulo (θ) = <b>${angDeg.toFixed(2)}°</b>`;
    } 
    else if (modo === 'sumaVectores') {
      const ax = parseFloat(document.getElementById('ax').value);
      const ay = parseFloat(document.getElementById('ay').value);
      const bx = parseFloat(document.getElementById('bx').value);
      const by = parseFloat(document.getElementById('by').value);

      const rx = ax + bx;
      const ry = ay + by;
      const magR = Math.sqrt(rx*rx + ry*ry);
      let angR = Math.atan2(ry, rx) * (180 / Math.PI);
      if (angR < 0) angR += 360;

      const prodEscalar = (ax * bx) + (ay * by);

      resDiv.innerHTML = `
        <strong>Vector Resultante (R = A + B):</strong><br>
        Rx = <b>${rx.toFixed(2)}</b>, Ry = <b>${ry.toFixed(2)}</b><br>
        Magnitud |R| = <b>${magR.toFixed(4)}</b><br>
        Ángulo θ = <b>${angR.toFixed(2)}°</b><br><br>
        <strong>Producto Escalar (A · B):</strong> <b>${prodEscalar.toFixed(2)}</b>`;
    }
  }

  // ==================== NAVEGACIÓN ====================
  function cambiarPestana(nombrePestana, evt) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(nombrePestana).classList.add('active');
    evt.currentTarget.classList.add('active');
  }

  // Inicialización
  actualizarUnidades();
  cambiarModoVector();
</script>

</body>
</html>
